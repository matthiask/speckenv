[tox]
envlist =
  py{39,310,311,312,313,314}
  py310-dj{32,40,42}
  py312-dj52
  py313-dj{60,61}
  py314-djmain

[testenv]
deps =
    coverage
    dj32: Django>=3.2,<4.0
    dj40: Django>=4.0,<4.1
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
    dj{32,40}: psycopg2-binary
    dj{42,52,60,61,main}: psycopg[binary]
    dj{32,40,42,52,60,61,main}: redis
changedir = {toxinidir}
skip_install = true
setenv =
    COVERAGE_FILE={envtmpdir}/.coverage
    dj{32,40,42,52,60,61,main}: PYTHONWARNINGS=error
commands =
    coverage run -m unittest discover -v
    coverage report -m
